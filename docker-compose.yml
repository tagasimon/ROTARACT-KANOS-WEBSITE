# Option B for Coolify: deploy as a "Docker Compose" resource (app + Postgres + volumes).
# Option A (recommended): a Dockerfile application + a separate Coolify PostgreSQL resource. See DEPLOY.md.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kanos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/kanos?schema=public
      APP_URL: ${APP_URL:?set APP_URL}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/storage
      SEED_ON_START: ${SEED_ON_START:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - media:/app/storage
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kanos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanos -d kanos"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  media:
  pgdata:
